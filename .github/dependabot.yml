version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: testing
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']

  - package-ecosystem: cargo
    directory: /rust-game-engine
    schedule:
      interval: weekly
    target-branch: testing

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: testing
