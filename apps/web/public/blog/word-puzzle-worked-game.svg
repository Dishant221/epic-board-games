<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">A worked Word Puzzle game</title>
  <desc id="d">Six rows of tiles. CRANE: R yellow, others grey. SLOTH: S and O green, T yellow, L and H grey. STORK: first four green, K grey. STORM: all green. Two empty rows remain. Short notes beside each row explain what was learned.</desc>
  <rect width="800" height="480" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">A full game in four guesses (hidden word: STORM)</text><rect x="40" y="64" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="67" y="101" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">C</text><rect x="102" y="64" width="54" height="54" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="129" y="101" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">R</text><rect x="164" y="64" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="191" y="101" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">A</text><rect x="226" y="64" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="253" y="101" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">N</text><rect x="288" y="64" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="315" y="101" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">E</text><text x="360" y="97" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">R is somewhere else; C, A, N, E are out.</text><rect x="40" y="130" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="67" y="167" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><rect x="102" y="130" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="129" y="167" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">L</text><rect x="164" y="130" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="191" y="167" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">O</text><rect x="226" y="130" width="54" height="54" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="253" y="167" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">T</text><rect x="288" y="130" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="315" y="167" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">H</text><text x="360" y="163" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">S and O are placed. T is in but not fourth.</text><rect x="40" y="196" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="67" y="233" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><rect x="102" y="196" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="129" y="233" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">T</text><rect x="164" y="196" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="191" y="233" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">O</text><rect x="226" y="196" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="253" y="233" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">R</text><rect x="288" y="196" width="54" height="54" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="315" y="233" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">K</text><text x="360" y="229" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Only the last letter is wrong now.</text><rect x="40" y="262" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="67" y="299" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><rect x="102" y="262" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="129" y="299" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">T</text><rect x="164" y="262" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="191" y="299" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">O</text><rect x="226" y="262" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="253" y="299" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">R</text><rect x="288" y="262" width="54" height="54" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="315" y="299" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">M</text><text x="360" y="295" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Solved. Two guesses to spare.</text><rect x="40" y="328" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="67" y="365" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="102" y="328" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="129" y="365" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="164" y="328" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="191" y="365" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="226" y="328" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="253" y="365" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="288" y="328" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="315" y="365" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><text x="360" y="361" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start"></text><rect x="40" y="394" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="67" y="431" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="102" y="394" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="129" y="431" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="164" y="394" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="191" y="431" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="226" y="394" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="253" y="431" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><rect x="288" y="394" width="54" height="54" rx="8" fill="#0e0e2c" stroke="#475569" stroke-width="2"/><text x="315" y="431" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle"> </text><text x="360" y="427" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start"></text>
</svg>
