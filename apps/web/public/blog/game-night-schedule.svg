<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">A sample 90-minute family game night</title>
  <desc id="d">A horizontal timeline from 0 to 90 minutes. Blocks: 0 to 5 join the room and test microphones; 5 to 15 Tic Tac Toe warm-up; 15 to 35 Snakes, Dragons and Ladders, two races; 35 to 45 break; 45 to 70 Connect 4 and Checkers in pairs; 70 to 90 Epic Puzzle Board together.</desc>
  <rect width="800" height="340" rx="20" fill="#17173f"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">A 90-minute evening that works for ages 6 to 86</text>

  <!-- axis: 0..90 min over x 60..740 (7.555 px/min) -->
  <line x1="60" y1="230" x2="740" y2="230" stroke="#34347a" stroke-width="2"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="60" y="252">0</text>
    <text x="173" y="252">15</text>
    <text x="287" y="252">30</text>
    <text x="400" y="252">45</text>
    <text x="513" y="252">60</text>
    <text x="627" y="252">75</text>
    <text x="740" y="252">90 min</text>
  </g>
  <g stroke="#34347a" stroke-width="1">
    <line x1="173" y1="225" x2="173" y2="235"/><line x1="287" y1="225" x2="287" y2="235"/><line x1="400" y1="225" x2="400" y2="235"/><line x1="513" y1="225" x2="513" y2="235"/><line x1="627" y1="225" x2="627" y2="235"/>
  </g>

  <!-- blocks -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="150" width="38" height="70" rx="8" fill="#64748b"/>
    <text x="79" y="135" fill="#cbd5e1">Join</text>
    <text x="79" y="120" fill="#94a3b8" font-size="11">mic check</text>

    <rect x="98" y="150" width="75" height="70" rx="8" fill="#38bdf8"/>
    <text x="135" y="190" fill="#07071a" font-weight="700">Tic Tac</text>
    <text x="135" y="206" fill="#07071a" font-weight="700">Toe</text>
    <text x="135" y="135" fill="#cbd5e1">2 min each</text>

    <rect x="173" y="150" width="151" height="70" rx="8" fill="#4ade80"/>
    <text x="248" y="190" fill="#07071a" font-weight="700">Snakes, Dragons</text>
    <text x="248" y="206" fill="#07071a" font-weight="700">&amp; Ladders ×2</text>
    <text x="248" y="135" fill="#cbd5e1">4 players, 10 min a race</text>

    <rect x="324" y="150" width="76" height="70" rx="8" fill="#23235a" stroke="#34347a" stroke-dasharray="4 4"/>
    <text x="362" y="190" fill="#cbd5e1">Break</text>
    <text x="362" y="206" fill="#94a3b8" font-size="11">snacks</text>

    <rect x="400" y="150" width="189" height="70" rx="8" fill="#f43f5e"/>
    <text x="494" y="190" fill="#ffffff" font-weight="700">Connect 4 + Checkers</text>
    <text x="494" y="206" fill="#ffffff">two tables of two</text>
    <text x="494" y="135" fill="#cbd5e1">5 min and 15 min games</text>

    <rect x="589" y="150" width="151" height="70" rx="8" fill="#d946ef"/>
    <text x="664" y="190" fill="#ffffff" font-weight="700">Epic Puzzle</text>
    <text x="664" y="206" fill="#ffffff">Board, co-op</text>
    <text x="664" y="135" fill="#cbd5e1">wind down, 15 min</text>
  </g>

  <text x="400" y="290" text-anchor="middle" font-size="13" fill="#94a3b8">Short games first while everyone settles, the long race in the middle, and a calm co-op puzzle to finish.</text>
  <text x="400" y="312" text-anchor="middle" font-size="13" fill="#94a3b8">Swap in Epic Business (about 45 minutes) when you have older players and a full evening.</text>
</svg>
