<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Using crossing letters to confirm an answer</title>
  <desc id="d">A horizontal five-square entry labelled 4 Across (E, Q, U) crosses a vertical five-square entry labelled 2 Down (R, O, U). The shared square containing U is highlighted in amber. Text beside explains that both clues must agree on that letter, confirming EQUIP and ROUND.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Crossings: one square, two clues</text><rect x="188" y="62" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="220" y="105" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle">R</text><text x="194" y="80" font-size="13" fill="#1e1b4b" font-weight="700" text-anchor="start">2</text><rect x="188" y="126" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="220" y="169" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle">O</text><rect x="188" y="254" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="220" y="297" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle"></text><rect x="188" y="318" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="220" y="361" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle"></text><rect x="60" y="190" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="92" y="233" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle">E</text><text x="66" y="208" font-size="13" fill="#1e1b4b" font-weight="700" text-anchor="start">4</text><rect x="124" y="190" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="156" y="233" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle">Q</text><rect x="188" y="190" width="64" height="64" fill="#fbbf24" stroke="#475569" stroke-width="1.5"/><text x="220" y="233" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle">U</text><rect x="252" y="190" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="284" y="233" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle"></text><rect x="316" y="190" width="64" height="64" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="348" y="233" font-size="30" fill="#1e1b4b" font-weight="700" text-anchor="middle"></text><rect x="185" y="187" width="70" height="70" fill="none" stroke="#fbbf24" stroke-width="4" rx="6"/><text x="470" y="110" font-size="15" fill="#d946ef" font-weight="700" text-anchor="start">4 Across: Gear up (5)</text><text x="470" y="134" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">You have E, Q and are unsure how it ends.</text><text x="470" y="174" font-size="15" fill="#38bdf8" font-weight="700" text-anchor="start">2 Down: Circular (5)</text><text x="470" y="198" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">R, O are in; the third letter is shared.</text><text x="470" y="250" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">The amber square belongs to both answers.</text><text x="470" y="268" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">EQU_ _ and RO_ _ _ agree on U, which</text><text x="470" y="286" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">confirms EQUIP and ROUND together.</text><text x="470" y="330" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">When one clue stumps you, solve the words</text><text x="470" y="348" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">that cross it and read the answer off the</text><text x="470" y="366" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">letters you have already earned.</text><text x="470" y="420" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Tap the shared square twice to switch</text><text x="470" y="438" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">between the across and the down entry.</text>
</svg>
