<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Rows, columns and boxes in Sudoku</title>
  <desc id="d">A nine by nine Sudoku grid with one row highlighted in violet, one column in blue and one three by three box in amber. The highlighted row contains the digits 1 to 9 in order. A legend explains that every cell belongs to one row, one column and one box, and a digit must be legal in all three.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Three kinds of "house" in Sudoku</text><rect x="40" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="60" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="104" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="148" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="192" width="44" height="44" fill="#0e0e2c"/