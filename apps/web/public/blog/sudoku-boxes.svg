5569" stroke-width="1"/><line x1="260" y1="60" x2="260" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="280" x2="436" y2="280" stroke="#475569" stroke-width="1"/><line x1="304" y1="60" x2="304" y2="456" stroke="#e2e8f0" stroke-width="3"/><line x1="40" y1="324" x2="436" y2="324" stroke="#e2e8f0" stroke-width="3"/><line x1="348" y1="60" x2="348" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="368" x2="436" y2="368" stroke="#475569" stroke-width="1"/><line x1="392" y1="60" x2="392" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="412" x2="436" y2="412" stroke="#475569" stroke-width="1"/><line x1="436" y1="60" x2="436" y2="456" stroke="#e2e8f0" stroke-width="3"/><line x1="40" y1="456" x2="436" y2="456" stroke="#e2e8f0" stroke-width="3"/><text x="62" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">1</text><text x="106" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">2</text><text x="150" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">3</text><text x="194" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">4</text><text x="238" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">5</text><text x="282" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">6</text><text x="326" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">7</text><text x="370" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">8</text><text x="414" y="221.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">9</text><rect x="500" y="96" width="18" height="18" rx="4" fill="#8b5cf6"/><text x="528" y="110" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Row</text><text x="528" y="132" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Nine cells across. Digits 1 to 9, each once.</text><rect x="500" y="176" width="18" height="18" rx="4" fill="#38bdf8"/><text x="528" y="190" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Column</text><text x="528" y="212" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Nine cells down. Digits 1 to 9, each once.</text><rect x="500" y="256" width="18" height="18" rx="4" fill="#fbbf24"/><text x="528" y="270" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Box</text><text x="528" y="292" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">A 3 x 3 block inside the thick lines.</text><text x="500" y="340" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">Every cell belongs to exactly one row,</text><text x="500" y="360" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">one column and one box. A digit you place</text><text x="500" y="380" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">must be legal in all three at once.</text><text x="500" y="430" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">The highlighted row shows the one</text><text x="500" y="448" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">and only arrangement rule: 1 to 9, no repeats.</text>
</svg>
