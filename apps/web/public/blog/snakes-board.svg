<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t">Snakes, Dragons and Ladders board numbering</title>
<desc id="d">A 10 by 10 board numbered 1 to 100. Square 1 is bottom left, each row alternates direction (boustrophedon) and 100 is top left. A ladder runs from 4 up to 25 and a dragon's head on 87 slides down to its tail on 36.</desc>
<rect width="800" height="560" rx="20" fill="#17173f"/>
<text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">Rows snake back and forth: 1 is bottom-left, 100 is top-left</text>
