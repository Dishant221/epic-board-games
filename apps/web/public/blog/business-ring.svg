<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t">The Epic Business board: 40 spaces in a ring</title>
<desc id="d">A square ring of 40 spaces. Payday is the bottom-right corner and play moves clockwise. The other corners are Free Rest (bottom left), Lock-up (top left) and Go to Lock-up (top right). Each side holds nine spaces: districts in colour groups of two or three, one station in the middle of each side, and two utilities.</desc>
