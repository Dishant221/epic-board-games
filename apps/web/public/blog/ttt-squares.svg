<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Tic Tac Toe grid with centre, corner and edge squares labelled</title>
  <desc id="d">A 3 by 3 Tic Tac Toe grid. The middle square is labelled centre and lies on four winning lines, the four corner squares are labelled corner and lie on three lines each, and the four side squares are labelled edge and lie on two lines each.</desc>
  <rect width="800" height="340" rx="20" fill="#17173f"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">The three kinds of square</text>
  <rect x="280" y="70" width="240" height="240" rx="12" fill="#0e0e2c"/>
  <line x1="360" y1="78" x2="360" y2="302" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="288" y1="150" x2="512" y2="150" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="78" x2="440" y2="302" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="288" y1="230" x2="512" y2="230" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">corner</text>
  <text x="400" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8">edge</text>
  <text x="480" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">corner</text>
  <text x="320" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8">edge</text>
  <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#d946ef">centre</text>
  <text x="480" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8">edge</text>
  <text x="320" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">corner</text>
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#38bdf8">edge</text>
  <text x="480" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">corner</text>
  <rect x="40" y="110" width="18" height="18" rx="4" fill="#d946ef"/>
  <text x="66" y="124" font-size="14" fill="#e2e8f0">Centre: on 4 lines</text>
  <rect x="40" y="150" width="18" height="18" rx="4" fill="#fbbf24"/>
  <text x="66" y="164" font-size="14" fill="#e2e8f0">Corner: on 3 lines</text>
  <rect x="40" y="190" width="18" height="18" rx="4" fill="#38bdf8"/>
  <text x="66" y="204" font-size="14" fill="#e2e8f0">Edge: on 2 lines</text>
  <text x="560" y="110" font-size="14" fill="#cbd5e1">8 winning lines in total:</text>
  <text x="560" y="132" font-size="14" fill="#cbd5e1">3 rows, 3 columns</text>
  <text x="560" y="154" font-size="14" fill="#cbd5e1">and 2 diagonals</text>
  <text x="560" y="194" font-size="14" fill="#cbd5e1">X always moves first</text>
  <text x="560" y="216" font-size="14" fill="#cbd5e1">and gets 5 of the 9 turns</text>
</svg>
