  <text x="40" y="310" font-size="13" fill="#cbd5e1" >Kingside: the king slides two squares towards the h-rook; the rook hops over to f1.</text>
  <text x="40" y="332" font-size="13" fill="#cbd5e1" >Queenside: the king goes two squares to c1 and the a-rook lands on d1 (b1 must also be empty).</text>
  <text x="40" y="362" font-size="13" fill="#94a3b8" >Allowed only if the king and that rook have never moved, every square between them is empty,</text>
  <text x="40" y="382" font-size="13" fill="#94a3b8" >and the king is not in check, does not cross an attacked square and does not land on one.</text>

</svg>
