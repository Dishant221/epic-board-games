<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Castling kingside and queenside</title>
  <desc id="d">Three small chess boards. The first shows the white king on e1 and rook on h1 with arrows pointing to g1 and f1. The second shows the position after kingside castling: king on g1, rook on f1. The third shows queenside castling: king on c1, rook on d1. Text beneath lists the conditions for castling.</desc>
