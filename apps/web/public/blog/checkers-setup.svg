    <rect x="0" y="0" width="400" height="400" fill="none" stroke="#0e0e2c" stroke-width="3"/>
    <text x="200" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Starting position: 12 pieces each</text>
  </g>
  <rect x="520" y="79" width="14" height="14" rx="3" fill="#f43f5e"/>
  <text x="542" y="90" font-size="13" fill="#cbd5e1" >Red: moves first, towards rank 8</text>
  <rect x="520" y="107" width="14" height="14" rx="3" fill="#1e1b4b"/>
  <text x="542" y="118" font-size="13" fill="#cbd5e1" >Dark: moves towards rank 1</text>
  <text x="520" y="170" font-size="13" fill="#cbd5e1" >Only the 32 dark squares are used.</text>
  <text x="520" y="190" font-size="13" fill="#cbd5e1" >Each side fills its three nearest</text>
  <text x="520" y="210" font-size="13" fill="#cbd5e1" >rows, leaving two empty rows</text>
  <text x="520" y="230" font-size="13" fill="#cbd5e1" >in the middle of the board.</text>
  <text x="520" y="280" font-size="13" fill="#94a3b8" >Each player should have a dark</text>
  <text x="520" y="300" font-size="13" fill="#94a3b8" >square in their bottom-left corner.</text>
  <text x="520" y="340" font-size="13" fill="#94a3b8" >Rows 1 and 8 are the back ranks,</text>
  <text x="520" y="360" font-size="13" fill="#94a3b8" >where enemy pieces are crowned.</text>

</svg>
