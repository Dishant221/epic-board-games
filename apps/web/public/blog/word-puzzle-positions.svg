<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Common letters by position in five-letter words</title>
  <desc id="d">Five columns labelled Position 1 to Position 5, each listing five letters from most to least common: S C B T P, then A O R E I, then A I O E U, then E N S A L, then E Y T S R. Vowels are amber and consonants blue, with brighter tiles marking more frequent letters.</desc>
  <rect width="800" height="440" rx="20" fill="#17173f"/>
