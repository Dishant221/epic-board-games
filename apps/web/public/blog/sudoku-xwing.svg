</text><text x="106" y="350.68" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">4</text><text x="282" y="350.68" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">4</text><text x="106" y="218.68" font-size="13" fill="#f43f5e" font-weight="600" text-anchor="middle">4</text><text x="106" y="438.68" font-size="13" fill="#f43f5e" font-weight="600" text-anchor="middle">4</text><text x="282" y="262.68" font-size="13" fill="#f43f5e" font-weight="600" text-anchor="middle">4</text><text x="282" y="86.68" font-size="13" fill="#f43f5e" font-weight="600" text-anchor="middle">4</text><text x="194" y="133.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">9</text><text x="370" y="133.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">2</text><text x="62" y="353.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">6</text><text x="414" y="353.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">1</text><text x="150" y="177.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">3</text><text x="238" y="309.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">8</text><text x="326" y="397.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">5</text><text x="500" y="100" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Two rows, two columns</text><text x="500" y="122" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">In row 2 and row 7, candidate 4 appears in</text><text x="500" y="140" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">exactly two cells, and both rows use the</text><text x="500" y="158" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">same two columns (2 and 6).</text><text x="500" y="198" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Why it works</text><text x="500" y="220" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Each of those rows needs a 4. Whichever</text><text x="500" y="238" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">corner row 2 uses, row 7 must use the</text><text x="500" y="256" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">opposite one, so columns 2 and 6 each</text><text x="500" y="274" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">get their 4 from one of the corners.</text><text x="500" y="314" font-size="16" fill="#f43f5e" font-weight="700" text-anchor="start">The elimination</text><text x="500" y="336" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Candidate 4 can be struck from every other</text><text x="500" y="354" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">cell in columns 2 and 6 (red).</text><text x="500" y="410" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Violet corners: the X-wing cells.</text><text x="500" y="428" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Red cells: 4 removed.</text>
</svg>
