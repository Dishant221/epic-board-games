<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">An X-wing pattern on candidate 4</title>
  <desc id="d">A Sudoku grid with rows 2 and 7 tinted violet. In each of those rows the candidate 4 sits in only two cells, at columns 2 and 6, forming a rectangle joined by dashed diagonal lines. Four other cells in columns 2 and 6 are tinted red with a struck-out 4, showing the eliminations.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
