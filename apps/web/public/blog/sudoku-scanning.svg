<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Scanning (cross-hatching) in Sudoku</title>
  <desc id="d">A Sudoku grid where two 7s in the top two rows and one 7 in the first column cast red bands across the top-left box. Combined with a given 5, only one cell in that box remains, highlighted green with a 7. Numbered steps on the right explain the elimination.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
