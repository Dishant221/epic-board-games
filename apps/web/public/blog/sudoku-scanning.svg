rect x="216" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="192" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="236" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="280" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="84" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="128" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="172" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="216" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="260" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="304" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="348" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="392" y="324" width="44" height="44" fill="#0e0e2c"/><rect x="40" y="368" width="44" height="44" fill="#0e0e