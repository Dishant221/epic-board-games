" stroke-width="3"/><line x1="216" y1="60" x2="216" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="236" x2="436" y2="236" stroke="#475569" stroke-width="1"/><line x1="260" y1="60" x2="260" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="280" x2="436" y2="280" stroke="#475569" stroke-width="1"/><line x1="304" y1="60" x2="304" y2="456" stroke="#e2e8f0" stroke-width="3"/><line x1="40" y1="324" x2="436" y2="324" stroke="#e2e8f0" stroke-width="3"/><line x1="348" y1="60" x2="348" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="368" x2="436" y2="368" stroke="#475569" stroke-width="1"/><line x1="392" y1="60" x2="392" y2="456" stroke="#475569" stroke-width="1"/><line x1="40" y1="412" x2="436" y2="412" stroke="#475569" stroke-width="1"/><line x1="436" y1="60" x2="436" y2="456" stroke="#e2e8f0" stroke-width="3"/><line x1="40" y1="456" x2="436" y2="456" stroke="#e2e8f0" stroke-width="3"/><text x="282" y="89.2" font-size="20" fill="#f43f5e" font-weight="600" text-anchor="middle">7</text><text x="370" y="133.2" font-size="20" fill="#f43f5e" font-weight="600" text-anchor="middle">7</text><text x="62" y="353.2" font-size="20" fill="#f43f5e" font-weight="600" text-anchor="middle">7</text><text x="106" y="177.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">5</text><text x="106" y="89.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">3</text><text x="150" y="133.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">8</text><text x="238" y="265.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">2</text><text x="326" y="397.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">1</text><text x="194" y="441.2" font-size="20" fill="#e2e8f0" font-weight="600" text-anchor="middle">9</text><text x="150" y="177.92" font-size="22" fill="#4ade80" font-weight="600" text-anchor="middle">7</text><text x="500" y="100" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">1. Find the 7s nearby</text><text x="500" y="122" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Rows 1 and 2 already hold a 7, so the</text><text x="500" y="140" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">top-left box cannot have a 7 in those rows.</text><text x="500" y="180" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">2. Check the columns</text><text x="500" y="202" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Column 1 has a 7 lower down, so the first</text><text x="500" y="220" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">column of the box is out as well.</text><text x="500" y="260" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">3. Remove the givens</text><text x="500" y="282" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Row 3 of the box has a 5 in the middle cell,</text><text x="500" y="300" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">which cannot change.</text><text x="500" y="340" font-size="16" fill="#4ade80" font-weight="700" text-anchor="start">4. One cell left</text><text x="500" y="362" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">The green cell is the only place a 7 can go</text><text x="500" y="380" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">in this box. Fill it in with confidence.</text><text x="500" y="430" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Red bands show the cells the existing</text><text x="500" y="448" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">7s have ruled out.</text>
</svg>
