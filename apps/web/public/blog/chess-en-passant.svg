<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">En passant in three steps</title>
  <desc id="d">Three small chess boards. First, a black pawn moves two squares from d7 to d5 beside a white pawn on e5. Second, the white pawn captures diagonally onto d6, the square the black pawn skipped. Third, the black pawn has been removed and the white pawn stands on d6.</desc>
  <defs>
    <pattern id="cb50" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="#cbd5e1"/><rect x="50" width="50" height="50" fill="#475569"/><rect y="50" width="50" height="50" fill="#475569"/></pattern>
    <pattern id="cb28" width="56" height="56" patternUnits="userSpaceOnUse"><rect width="56" height="56" fill="#cbd5e1"/><rect x="28" width="28" height="28" fill="#475569"/><rect y="28" width="28" height="28" fill="#475569"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker>
  </defs>
  <rect width="800" height="400" rx="20" fill="#17173f"/>
  <g transform="translate(40 50)">
    <rect width="224" height="224" fill="url(#cb28)"/>
    <rect x="86" y="30" width="24" height="24" rx="4" fill="#fbbf24" opacity="0.55"/>
    <rect x="86" y="86" width="24" height="24" rx="4" fill="#fbbf24" opacity="0.55"/>
    <text x="126" y="218.96" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♚</text>
    <text x="126" y="22.96" text-anchor="middle" font-size="24.08" fill="#0f172a" stroke="#94a3b8" stroke-width="0.6">♚</text>
    <text x="126" y="106.96000000000001" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="98" y="50.96" text-anchor="middle" font-size="24.08" fill="#0f172a" stroke="#94a3b8" stroke-width="0.6">♟</text>
    <line x1="98" y1="42" x2="98" y2="98" stroke="#fbbf24" stroke-width="2.52" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.95"/>
    <rect x="0" y="0" width="224" height="224" fill="none" stroke="#0e0e2c" stroke-width="3"/>
    <text x="112" y="-10" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">1. Black plays d7–d5</text>
  </g>
  <g transform="translate(300 50)">
    <rect width="224" height="224" fill="url(#cb28)"/>
    <rect x="86" y="58" width="24" height="24" rx="4" fill="#4ade80" opacity="0.55"/>
    <rect x="86" y="86" width="24" height="24" rx="4" fill="#f43f5e" opacity="0.55"/>
    <text x="126" y="218.96" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♚</text>
    <text x="126" y="22.96" text-anchor="middle" font-size="24.08" fill="#0f172a" stroke="#94a3b8" stroke-width="0.6">♚</text>
    <text x="126" y="106.96000000000001" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="98" y="106.96000000000001" text-anchor="middle" font-size="24.08" fill="#0f172a" stroke="#94a3b8" stroke-width="0.6">♟</text>
    <line x1="126" y1="98" x2="98" y2="70" stroke="#4ade80" stroke-width="2.52" stroke-linecap="round" marker-end="url(#arrowg)" opacity="0.95"/>
    <rect x="0" y="0" width="224" height="224" fill="none" stroke="#0e0e2c" stroke-width="3"/>
    <text x="112" y="-10" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">2. White captures exd6 e.p.</text>
  </g>
  <g transform="translate(560 50)">
    <rect width="224" height="224" fill="url(#cb28)"/>
    <rect x="86" y="58" width="24" height="24" rx="4" fill="#4ade80" opacity="0.55"/>
    <text x="126" y="218.96" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♚</text>
    <text x="126" y="22.96" text-anchor="middle" font-size="24.08" fill="#0f172a" stroke="#94a3b8" stroke-width="0.6">♚</text>
    <text x="98" y="78.96000000000001" text-anchor="middle" font-size="24.08" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <rect x="0" y="0" width="224" height="224" fill="none" stroke="#0e0e2c" stroke-width="3"/>
    <text x="112" y="-10" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">3. The pawn on d5 is gone</text>
  </g>
  <text x="40" y="310" font-size="13" fill="#cbd5e1" >A pawn that advances two squares from its starting rank passes the square it would normally</text>
  <text x="40" y="330" font-size="13" fill="#cbd5e1" >have stopped on. An enemy pawn standing beside it may capture it as if it had moved only one square.</text>
  <text x="40" y="360" font-size="13" fill="#fbbf24" >The capture must be made immediately, on the very next move, or the right is lost.</text>

</svg>
