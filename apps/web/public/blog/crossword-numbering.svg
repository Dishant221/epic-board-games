<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">How crossword squares are numbered</title>
  <desc id="d">A five by five crossword grid with four black squares. Numbers 1, 2 and 3 sit along the top row where down answers start; 1, 4 and 5 sit down the left where across answers start. A pink arrow runs along 1 Across and a blue arrow down 1 Down. A clue list for across and down is shown beside the grid.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Where the numbers come from</text><rect x="40" y="70" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="46" y="88" font-size="14" fill="#1e1b4b" font-weight="700" text-anchor="start">1</text><rect x="110" y="70" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="180" y="70" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="186" y="88" font-size="14" fill="#1e1b4b" font-weight="700" text-anchor="start">2</text><rect x="250" y="70" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="320" y="70" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="326" y="88" font-size="14" fill="#1e1b4b" font-weight="700" text-anchor="start">3</text><rect x="40" y="140" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="110" y="140" width="70" height="70" fill="#020617" stroke="#475569" stroke-width="1.5"/><rect x="180" y="140" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="250" y="140" width="70" height="70" fill="#020617" stroke="#475569" stroke-width="1.5"/><rect x="320" y="140" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="40" y="210" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="46" y="228" font-size="14" fill="#1e1b4b" font-weight="700" text-anchor="start">4</text><rect x="110" y="210" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="180" y="210" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="250" y="210" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="320" y="210" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="40" y="280" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="110" y="280" width="70" height="70" fill="#020617" stroke="#475569" stroke-width="1.5"/><rect x="180" y="280" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="250" y="280" width="70" height="70" fill="#020617" stroke="#475569" stroke-width="1.5"/><rect x="320" y="280" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="40" y="350" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="46" y="368" font-size="14" fill="#1e1b4b" font-weight="700" text-anchor="start">5</text><rect x="110" y="350" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="180" y="350" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="250" y="350" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><rect x="320" y="350" width="70" height="70" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d946ef"/></marker></defs><line x1="62" y1="116" x2="376" y2="116" stroke="#d946ef" stroke-width="4" marker-end="url(#ar)" opacity="0.9"/><line x1="86" y1="94" x2="86" y2="406" stroke="#38bdf8" stroke-width="4" marker-end="url(#ar)" opacity="0.9"/><text x="430" y="100" font-size="16" fill="#d946ef" font-weight="700" text-anchor="start">Across</text><text x="430" y="124" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">1  Looked after (5)</text><text x="430" y="144" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">4  Gear up (5)</text><text x="430" y="164" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">5  Unfortunately (5)</text><text x="430" y="210" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="start">Down</text><text x="430" y="234" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">1  Game with kings and queens (5)</text><text x="430" y="254" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">2  Circular (5)</text><text x="430" y="274" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start">3  Silly (5)</text><text x="430" y="324" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">A number sits in the first square of each</text><text x="430" y="342" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">answer, counting left to right, top to bottom.</text><text x="430" y="360" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Square 1 starts both 1 Across and 1 Down,</text><text x="430" y="378" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">so one number serves two clues.</text><text x="430" y="420" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">The length in brackets tells you how many</text><text x="430" y="438" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">letters the answer has.</text>
</svg>
