<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">English letter frequency bar chart</title>
  <desc id="d">A bar chart of the twelve most common letters in English text with approximate percentages: E 12.7, T 9.1, A 8.2, O 7.5, I 7.0, N 6.7, S 6.3, H 6.1, R 6.0, D 4.3, L 4.0 and C 2.8. Vowel bars are amber and consonant bars violet.</desc>
  <rect width="800" height="400" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Most common letters in English text (approx. %)</text><line x1="50" y1="330" x2="780" y2="330" stroke="#475569" stroke-width="2"/><rect x="60" y="101.4" width="44" height="228.6" rx="6" fill="#fbbf24"/><text x="82" y="93.4" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">12.7</text><text x="82" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">E</text><rect x="120" y="166.20000000000002" width="44" height="163.79999999999998" rx="6" fill="#8b5cf6"/><text x="142" y="158.20000000000002" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">9.1</text><text x="142" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">T</text><rect x="180" y="182.4" width="44" height="147.6" rx="6" fill="#fbbf24"/><text x="202" y="174.4" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">8.2</text><text x="202" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">A</text><rect x="240" y="195" width="44" height="135" rx="6" fill="#fbbf24"/><text x="262" y="187" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">7.5</text><text x="262" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">O</text><rect x="300" y="204" width="44" height="126" rx="6" fill="#fbbf24"/><text x="322" y="196" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">7.0</text><text x="322" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">I</text><rect x="360" y="209.39999999999998" width="44" height="120.60000000000001" rx="6" fill="#8b5cf6"/><text x="382" y="201.39999999999998" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">6.7</text><text x="382" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">N</text><rect x="420" y="216.60000000000002" width="44" height="113.39999999999999" rx="6" fill="#8b5cf6"/><text x="442" y="208.60000000000002" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">6.3</text><text x="442" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">S</text><rect x="480" y="220.2" width="44" height="109.8" rx="6" fill="#8b5cf6"/><text x="502" y="212.2" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">6.1</text><text x="502" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">H</text><rect x="540" y="222" width="44" height="108" rx="6" fill="#8b5cf6"/><text x="562" y="214" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">6.0</text><text x="562" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">R</text><rect x="600" y="252.60000000000002" width="44" height="77.39999999999999" rx="6" fill="#8b5cf6"/><text x="622" y="244.60000000000002" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">4.3</text><text x="622" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">D</text><rect x="660" y="258" width="44" height="72" rx="6" fill="#8b5cf6"/><text x="682" y="250" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">4.0</text><text x="682" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">L</text><rect x="720" y="279.6" width="44" height="50.4" rx="6" fill="#8b5cf6"/><text x="742" y="271.6" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="middle">2.8</text><text x="742" y="356" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="middle">C</text><rect x="60" y="370" width="16" height="16" rx="4" fill="#fbbf24"/><text x="84" y="383" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Vowels</text><rect x="160" y="370" width="16" height="16" rx="4" fill="#8b5cf6"/><text x="184" y="383" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Consonants</text><text x="760" y="383" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="end">Typical values from standard English frequency tables</text>
</svg>
