    <text x="175" y="341" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="225" y="341" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="275" y="341" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="325" y="341" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="375" y="341" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♟</text>
    <text x="75" y="391" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♞</text>
    <text x="325" y="391" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♞</text>
    <line x1="325" y1="375" x2="275" y2="275" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowg)" opacity="0.95"/>
    <line x1="75" y1="375" x2="125" y2="275" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowg)" opacity="0.95"/>
