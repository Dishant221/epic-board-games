    <rect x="202" y="152" width="46" height="46" rx="4" fill="#8b5cf6" opacity="0.55"/>
    <text x="25" y="391" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♜</text>
