    <text x="200" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Opening principles at a glance</text>
  </g>
  <rect x="520" y="79" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="542" y="90" font-size="13" fill="#cbd5e1" >The four centre squares</text>
  <rect x="520" y="107" width="14" height="14" rx="3" fill="#fbbf24"/>
  <text x="542" y="118" font-size="13" fill="#cbd5e1" >Pawns claim the centre</text>
  <rect x="520" y="135" width="14" height="14" rx="3" fill="#4ade80"/>
  <text x="542" y="146" font-size="13" fill="#cbd5e1" >Knights come out first</text>
  <text x="520" y="200" font-size="13" fill="#cbd5e1" >1. Control the centre with pawns.</text>
  <text x="520" y="222" font-size="13" fill="#cbd5e1" >2. Develop knights, then bishops.</text>
  <text x="520" y="244" font-size="13" fill="#cbd5e1" >3. Castle early to tuck the king away.</text>
  <text x="520" y="266" font-size="13" fill="#cbd5e1" >4. Move each piece once, then move</text>
  <text x="520" y="286" font-size="13" fill="#cbd5e1" >    the next one.</text>
  <text x="520" y="308" font-size="13" fill="#cbd5e1" >5. Keep the queen home until the</text>
  <text x="520" y="328" font-size="13" fill="#cbd5e1" >    minor pieces are out.</text>
  <text x="520" y="372" font-size="13" fill="#94a3b8" >A knight on f3 or c3 attacks two</text>
  <text x="520" y="392" font-size="13" fill="#94a3b8" >centre squares at once, which is</text>
  <text x="520" y="412" font-size="13" fill="#94a3b8" >why they come out before bishops.</text>

</svg>
