<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t">How often each two-dice total comes up</title>
<desc id="d">Bar chart of the 36 equally likely two-dice outcomes. Totals 2 and 12 each have 1 way, 3 and 11 have 2, 4 and 10 have 3, 5 and 9 have 4, 6 and 8 have 5, and 7 has 6 ways, which is one roll in six.</desc>
<rect width="800" height="460" rx="20" fill="#17173f"/>
<text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">Two dice: 36 outcomes, and 7 is the most common total</text>
<line x1="60" y1="360" x2="752" y2="360" stroke="#34347a" stroke-width="2"/>
<rect x="70" y="318" width="50" height="42" rx="6" fill="#8b5cf6"/><text x="95" y="310" text-anchor="middle" font-size="13" fill="#cbd5e1">1/36</text><text x="95" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">2</text><rect x="132" y="276" width="50" height="84" rx="6" fill="#8b5cf6"/><text x="157" y="268" text-anchor="middle" font-size="13" fill="#cbd5e1">2/36</text><text x="157" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">3</text><rect x="194" y="234" width="50" height="126" rx="6" fill="#8b5cf6"/><text x="219" y="226" text-anchor="middle" font-size="13" fill="#cbd5e1">3/36</text><text x="219" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">4</text><rect x="256" y="192" width="50" height="168" rx="6" fill="#8b5cf6"/><text x="281" y="184" text-anchor="middle" font-size="13" fill="#cbd5e1">4/36</text><text x="281" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">5</text><rect x="318" y="150" width="50" height="210" rx="6" fill="#fbbf24"/><text x="343" y="142" text-anchor="middle" font-size="13" fill="#cbd5e1">5/36</text><text x="343" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">6</text><rect x="380" y="108" width="50" height="252" rx="6" fill="#fbbf24"/><text x="405" y="100" text-anchor="middle" font-size="13" fill="#cbd5e1">6/36</text><text x="405" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">7</text><rect x="442" y="150" width="50" height="210" rx="6" fill="#fbbf24"/><text x="467" y="142" text-anchor="middle" font-size="13" fill="#cbd5e1">5/36</text><text x="467" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">8</text><rect x="504" y="192" width="50" height="168" rx="6" fill="#8b5cf6"/><text x="529" y="184" text-anchor="middle" font-size="13" fill="#cbd5e1">4/36</text><text x="529" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">9</text><rect x="566" y="234" width="50" height="126" rx="6" fill="#8b5cf6"/><text x="591" y="226" text-anchor="middle" font-size="13" fill="#cbd5e1">3/36</text><text x="591" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">10</text><rect x="628" y="276" width="50" height="84" rx="6" fill="#8b5cf6"/><text x="653" y="268" text-anchor="middle" font-size="13" fill="#cbd5e1">2/36</text><text x="653" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">11</text><rect x="690" y="318" width="50" height="42" rx="6" fill="#8b5cf6"/><text x="715" y="310" text-anchor="middle" font-size="13" fill="#cbd5e1">1/36</text><text x="715" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">12</text><text x="400" y="414" text-anchor="middle" font-size="14" fill="#94a3b8">Total rolled · 6, 7 and 8 together land on 16 of every 36 rolls (44%)</text><text x="400" y="438" text-anchor="middle" font-size="13" fill="#64748b">So the spaces 6 to 8 steps past a busy corner, such as Lock-up, get the most visitors</text></svg>
