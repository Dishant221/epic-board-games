<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Two Connect 4 threats, one on an odd row and one on an even row</title>
  <desc id="d">A Connect 4 board with rows numbered 1 to 6 from the bottom. Red has three in a row on row 3 and its winning cell in column 5 is marked R: an odd-row threat. Yellow has a diagonal whose winning cell in column 7 row 4 is marked Y: an even-row threat. Both cells float above empty space.</desc>
