  <text x="30" y="168" font-size="13" fill="#fbbf24">Odd row: good</text>
  <text x="30" y="186" font-size="13" fill="#fbbf24">for the first player</text>
  <text x="650" y="130" font-size="14" font-weight="700" fill="#facc15">Yellow threat</text>
  <text x="650" y="150" font-size="13" fill="#cbd5e1">Column 7, row 4</text>
  <text x="650" y="168" font-size="13" fill="#38bdf8">Even row: good</text>
  <text x="650" y="186" font-size="13" fill="#38bdf8">for the second player</text>
  <text x="400" y="470" text-anchor="middle" font-size="14" fill="#94a3b8">Rows are numbered from the bottom. Neither threat can be played yet: the cell below is empty.</text>
