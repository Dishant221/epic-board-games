<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Green, yellow and grey tiles explained</title>
  <desc id="d">Three rows of five letter tiles. CRANE shows grey C, R, N and green A, E. TALES shows all five tiles yellow. SLATE shows all five tiles green. A legend on the right explains green as right letter in the right spot, yellow as in the word but in a different spot, and grey as not in the word.</desc>
  <rect width="800" height="400" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Reading the colours (hidden word: SLATE)</text><rect x="40" y="70" width="56" height="56" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="68" y="108" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">C</text><rect x="104" y="70" width="56" height="56" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="132" y="108" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">R</text><rect x="168" y="70" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="196" y="108" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><rect x="232" y="70" width="56" height="56" rx="8" fill="#475569" stroke="none" stroke-width="2"/><text x="260" y="108" font-size="28" fill="#e2e8f0" font-weight="700" text-anchor="middle">N</text><rect x="296" y="70" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="324" y="108" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">E</text><text x="40" y="150" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">A and E are in the right place. C, R, N are not in the word.</text><rect x="40" y="180" width="56" height="56" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="68" y="218" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">T</text><rect x="104" y="180" width="56" height="56" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="132" y="218" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><rect x="168" y="180" width="56" height="56" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="196" y="218" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">L</text><rect x="232" y="180" width="56" height="56" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="260" y="218" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">E</text><rect x="296" y="180" width="56" height="56" rx="8" fill="#eab308" stroke="none" stroke-width="2"/><text x="324" y="218" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><text x="40" y="260" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Every letter is in the word, but each one is in the wrong spot.</text><rect x="40" y="290" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="68" y="328" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><rect x="104" y="290" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="132" y="328" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">L</text><rect x="168" y="290" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="196" y="328" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><rect x="232" y="290" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="260" y="328" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">T</text><rect x="296" y="290" width="56" height="56" rx="8" fill="#22c55e" stroke="none" stroke-width="2"/><text x="324" y="328" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">E</text><text x="40" y="370" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">All green: solved in three guesses.</text><rect x="470" y="80" width="26" height="26" rx="6" fill="#22c55e"/><text x="508" y="99" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Green</text><text x="508" y="119" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Right letter, right spot.</text><rect x="470" y="150" width="26" height="26" rx="6" fill="#eab308"/><text x="508" y="169" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Yellow</text><text x="508" y="189" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">In the word, different spot.</text><rect x="470" y="220" width="26" height="26" rx="6" fill="#475569"/><text x="508" y="239" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Grey</text><text x="508" y="259" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Not in the word at all.</text><text x="470" y="320" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">The on-screen keyboard copies these</text><text x="470" y="338" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">colours so you never have to remember</text><text x="470" y="356" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">which letters you have already ruled out.</text>
</svg>
