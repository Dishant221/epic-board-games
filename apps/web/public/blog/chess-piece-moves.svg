<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">How the knight and bishop move</title>
  <desc id="d">An 8 by 8 chess board with a white knight on c3 and a white bishop on d4. Amber dots mark the eight squares the knight can jump to; blue shading marks the diagonals the bishop controls. A side panel summarises how the rook, queen, king and pawn move.</desc>
  <defs>
    <pattern id="cb50" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="#cbd5e1"/><rect x="50" width="50" height="50" fill="#475569"/><rect y="50" width="50" height="50" fill="#475569"/></pattern>
    <pattern id="cb28" width="56" height="56" patternUnits="userSpaceOnUse"><rect width="56" height="56" fill="#cbd5e1"/><rect x="28" width="28" height="28" fill="#475569"/><rect y="28" width="28" height="28" fill="#475569"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker>
  </defs>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
  <g transform="translate(60 50)">
    <rect width="400" height="400" fill="url(#cb50)"/>
    <rect x="2" y="352" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="52" y="302" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="102" y="252" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="202" y="152" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="252" y="102" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="302" y="52" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="352" y="2" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="302" y="352" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="252" y="302" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="202" y="252" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="102" y="152" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="52" y="102" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <rect x="2" y="52" width="46" height="46" rx="4" fill="#38bdf8" opacity="0.55"/>
    <circle cx="75" cy="375" r="8.5" fill="#fbbf24"/>
    <circle cx="175" cy="375" r="8.5" fill="#fbbf24"/>
    <circle cx="25" cy="325" r="8.5" fill="#fbbf24"/>
    <circle cx="225" cy="325" r="8.5" fill="#fbbf24"/>
    <circle cx="25" cy="225" r="8.5" fill="#fbbf24"/>
    <circle cx="225" cy="225" r="8.5" fill="#fbbf24"/>
    <circle cx="75" cy="175" r="8.5" fill="#fbbf24"/>
    <circle cx="175" cy="175" r="8.5" fill="#fbbf24"/>
    <text x="125" y="291" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♞</text>
    <text x="175" y="241" text-anchor="middle" font-size="43" fill="#f8fafc" stroke="#334155" stroke-width="0.6">♝</text>
    <text x="25" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">a</text>
    <text x="75" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">b</text>
    <text x="125" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">c</text>
    <text x="175" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">d</text>
    <text x="225" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">e</text>
    <text x="275" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">f</text>
    <text x="325" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">g</text>
    <text x="375" y="416" text-anchor="middle" font-size="12" fill="#94a3b8">h</text>
    <text x="-10" y="29" text-anchor="middle" font-size="12" fill="#94a3b8">8</text>
