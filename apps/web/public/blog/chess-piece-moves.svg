    <text x="-10" y="129" text-anchor="middle" font-size="12" fill="#94a3b8">6</text>
    <text x="-10" y="179" text-anchor="middle" font-size="12" fill="#94a3b8">5</text>
    <text x="-10" y="229" text-anchor="middle" font-size="12" fill="#94a3b8">4</text>
    <text x="-10" y="279" text-anchor="middle" font-size="12" fill="#94a3b8">3</text>
    <text x="-10" y="329" text-anchor="middle" font-size="12" fill="#94a3b8">2</text>
    <text x="-10" y="379" text-anchor="middle" font-size="12" fill="#94a3b8">1</text>
    <rect x="0" y="0" width="400" height="400" fill="none" stroke="#0e0e2c" stroke-width="3"/>
    <text x="200" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Knight (c3) and bishop (d4)</text>
  </g>
  <rect x="520" y="79" width="14" height="14" rx="3" fill="#fbbf24"/>
  <text x="542" y="90" font-size="13" fill="#cbd5e1" >Knight: eight L-shaped jumps</text>
  <rect x="520" y="109" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="542" y="120" font-size="13" fill="#cbd5e1" >Bishop: unlimited diagonals</text>
  <text x="520" y="170" font-size="13" fill="#cbd5e1" >The knight is the only piece that</text>
  <text x="520" y="190" font-size="13" fill="#cbd5e1" >can jump over others. It always</text>
  <text x="520" y="210" font-size="13" fill="#cbd5e1" >lands on the opposite colour.</text>
  <text x="520" y="250" font-size="13" fill="#cbd5e1" >The bishop stays on one colour</text>
  <text x="520" y="270" font-size="13" fill="#cbd5e1" >for the whole game and stops</text>
  <text x="520" y="290" font-size="13" fill="#cbd5e1" >at the first piece in its path.</text>
  <text x="520" y="340" font-size="13" fill="#94a3b8" >Rook: straight lines (ranks and files).</text>
  <text x="520" y="360" font-size="13" fill="#94a3b8" >Queen: rook + bishop combined.</text>
  <text x="520" y="380" font-size="13" fill="#94a3b8" >King: one square in any direction.</text>
  <text x="520" y="400" font-size="13" fill="#94a3b8" >Pawn: forward one (two from start),</text>
  <text x="520" y="420" font-size="13" fill="#94a3b8" >captures one square diagonally.</text>

</svg>
