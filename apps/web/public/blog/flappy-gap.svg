<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Flappy Flyer pipe gap with the safe aim zone shaded</title>
  <desc id="d">A yellow bird on the left flies along a dashed path towards a pair of green pipes. The vertical gap between the pipes is marked, and the lower third of the gap is shaded amber and labelled safe aim zone, where a flap clears the top lip and gravity carries the bird through.</desc>
  <rect width="800" height="490" rx="20" fill="#17173f"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">Aim for the lower third of the gap</text>
  <rect x="30" y="420" width="740" height="50" rx="10" fill="#3f6212"/>
  <rect x="30" y="420" width="740" height="10" fill="#4ade80"/>
  <rect x="470" y="60" width="90" height="110" rx="6" fill="#16a34a"/>
  <rect x="462" y="142" width="106" height="28" rx="6" fill="#22c55e"/>
  <rect x="470" y="330" width="90" height="90" rx="6" fill="#16a34a"/>
  <rect x="462" y="330" width="106" height="28" rx="6" fill="#22c55e"/>
  <rect x="462" y="250" width="106" height="56" fill="#fbbf24" opacity="0.35" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="440" y1="170" x2="440" y2="330" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="430" y="255" text-anchor="end" font-size="14" fill="#38bdf8">the gap</text>
  <text x="580" y="278.8" font-size="14" font-weight="700" fill="#fbbf24">safe aim zone</text>
  <text x="580" y="298.8" font-size="13" fill="#cbd5e1">a flap here clears the</text>
  <text x="580" y="316.8" font-size="13" fill="#cbd5e1">top lip, gravity does the rest</text>
  <path d="M120 300 C 180 230, 230 230, 290 280 S 400 320, 470 262" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <ellipse cx="120" cy="300" rx="26" ry="20" fill="#facc15"/>
  <circle cx="132" cy="293" r="5" fill="#0e0e2c"/>
  <path d="M142 304 l16 4 l-16 6 z" fill="#f97316"/>
  <ellipse cx="108" cy="306" rx="12" ry="7" fill="#fde68a"/>
  <text x="120" y="350" text-anchor="middle" font-size="14" fill="#cbd5e1">Flyer</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Dashed line: a typical flight path. Score one point for every pipe pair you pass.</text>
</svg>
