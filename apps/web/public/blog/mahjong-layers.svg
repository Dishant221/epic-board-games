  <text x="760" y="172" font-size="13" fill="#94a3b8" text-anchor="end">1 tiles</text>
  <line x1="60" y1="340" x2="740" y2="340" stroke="#475569" stroke-width="2"/>
  <circle cx="400" cy="130" r="13" fill="#4ade80"/>
  <path d="M393 130 l5 5 l9 -10" stroke="#0e0e2c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="318" r="11" fill="#4ade80"/>
  <circle cx="730" cy="318" r="11" fill="#4ade80"/>
  <circle cx="160" cy="318" r="11" fill="#f43f5e"/>
  <text x="60" y="380" font-size="13" fill="#cbd5e1" >The single top tile and the two end tiles of every layer are free. A tile in the middle of layer 1</text>
  <text x="60" y="400" font-size="13" fill="#cbd5e1" >is blocked twice: by neighbours on both sides and by the layer resting on it. Clear the tall</text>
  <text x="60" y="420" font-size="13" fill="#cbd5e1" >stack first so the tiles underneath come into play.</text>
  <text x="60" y="456" font-size="13" fill="#fbbf24" >Rule of thumb: height before width. A tile on layer 5 unlocks far more than a tile on layer 1.</text>

</svg>
