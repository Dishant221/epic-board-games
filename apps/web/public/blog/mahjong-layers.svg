  <text x="760" y="286" font-size="13" fill="#94a3b8" text-anchor="end">9 tiles</text>
  <rect x="241" y="224" width="51.333333333333336" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
