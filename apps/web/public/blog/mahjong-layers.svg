  <text x="760" y="248" font-size="13" fill="#94a3b8" text-anchor="end">6 tiles</text>
  <rect x="321" y="186" width="51.333333333333336" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
