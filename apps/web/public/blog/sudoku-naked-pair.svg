<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">A naked pair in a Sudoku box</title>
  <desc id="d">A zoomed three by three Sudoku box. Two violet cells both show the pencil marks 2 and 5. In the remaining cells the candidates 2 and 5 are struck out in red, leaving one cell with only an 8 and another with only a 6. Text explains that the pair claims both digits.</desc>
  <rect width="800" height="500" rx="20" fill="#17173f"/>
<text x="40" y="40" font-size="20" fill="#e2e8f0" font-weight="700" text-anchor="start">Naked pair {2, 5} inside one box</text><rect x="40" y="70" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="170" y="70" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="300" y="70" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="40" y="200" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="170" y="200" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="300" y="200" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="40" y="330" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="170" y="330" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="300" y="330" width="130" height="130" fill="#0e0e2c" stroke="#475569"/><rect x="40" y="70" width="390" height="390" fill="none" stroke="#e2e8f0" stroke-width="3"/><rect x="40" y="70" width="130" height="130" fill="#8b5cf6" opacity="0.45"/><rect x="300" y="200" width="130" height="130" fill="#8b5cf6" opacity="0.45"/><text x="62" y="142" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">2</text><text x="92" y="142" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">5</text><text x="322" y="272" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">2</text><text x="352" y="272" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">5</text><text x="235" y="149" font-size="40" fill="#e2e8f0" font-weight="700" text-anchor="middle">7</text><text x="322" y="142" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">1</text><text x="352" y="142" font-size="22" fill="#f43f5e" font-weight="600" text-anchor="middle">2</text><line x1="343" y1="147" x2="361" y2="125" stroke="#f43f5e" stroke-width="2.5"/><text x="382" y="142" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">9</text><text x="105" y="279" font-size="40" fill="#e2e8f0" font-weight="700" text-anchor="middle">3</text><text x="192" y="272" font-size="22" fill="#f43f5e" font-weight="600" text-anchor="middle">5</text><line x1="183" y1="277" x2="201" y2="255" stroke="#f43f5e" stroke-width="2.5"/><text x="222" y="272" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">8</text><text x="105" y="409" font-size="40" fill="#e2e8f0" font-weight="700" text-anchor="middle">4</text><text x="192" y="402" font-size="22" fill="#f43f5e" font-weight="600" text-anchor="middle">2</text><line x1="183" y1="407" x2="201" y2="385" stroke="#f43f5e" stroke-width="2.5"/><text x="222" y="402" font-size="22" fill="#e2e8f0" font-weight="600" text-anchor="middle">6</text><text x="252" y="402" font-size="22" fill="#f43f5e" font-weight="600" text-anchor="middle">5</text><line x1="243" y1="407" x2="261" y2="385" stroke="#f43f5e" stroke-width="2.5"/><text x="365" y="409" font-size="40" fill="#e2e8f0" font-weight="700" text-anchor="middle">1</text><text x="470" y="110" font-size="16" fill="#e2e8f0" font-weight="700" text-anchor="start">Two cells, two candidates</text><text x="470" y="132" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">The violet cells can only be 2 or 5.</text><text x="470" y="150" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Between them they must use both digits,</text><text x="470" y="168" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">even if we do not yet know which is which.</text><text x="470" y="208" font-size="16" fill="#f43f5e" font-weight="700" text-anchor="start">So nobody else may have them</text><text x="470" y="230" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">Strike 2 and 5 from the other cells of the</text><text x="470" y="248" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">box (red). The {5, 8} cell collapses to a</text><text x="470" y="266" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">single 8, and {2, 6, 5} becomes 6.</text><text x="470" y="306" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">The same logic works along a row or a</text><text x="470" y="324" font-size="13" fill="#cbd5e1" font-weight="400" text-anchor="start">column, and extends to naked triples.</text><text x="470" y="380" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Large digits: placed values.</text><text x="470" y="398" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="start">Small digits: pencil marks.</text>
</svg>
