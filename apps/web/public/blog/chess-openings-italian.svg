  <text x="520" y="80" font-size="16" fill="#e2e8f0" font-weight="700">Moves so far</text>
  <text x="520" y="108" font-size="15" fill="#cbd5e1" >1. e4   e5</text>
  <text x="520" y="132" font-size="15" fill="#cbd5e1" >2. Nf3  Nc6</text>
  <text x="520" y="156" font-size="15" fill="#cbd5e1" >3. Bc4</text>
  <rect x="520" y="189" width="14" height="14" rx="3" fill="#4ade80"/>
  <text x="542" y="200" font-size="13" fill="#cbd5e1" >Bishop eyes the f7 pawn</text>
  <rect x="520" y="215" width="14" height="14" rx="3" fill="#f43f5e"/>
  <text x="542" y="226" font-size="13" fill="#cbd5e1" >f7: defended only by the king</text>
  <rect x="520" y="241" width="14" height="14" rx="3" fill="#38bdf8"/>
  <text x="542" y="252" font-size="13" fill="#cbd5e1" >Knights developed first</text>
  <text x="520" y="300" font-size="13" fill="#94a3b8" >Both sides have claimed a centre</text>
  <text x="520" y="320" font-size="13" fill="#94a3b8" >pawn and brought out a knight.</text>
  <text x="520" y="340" font-size="13" fill="#94a3b8" >White is one move from castling.</text>
  <text x="520" y="380" font-size="13" fill="#cbd5e1" >Good replies for Black:</text>
  <text x="520" y="400" font-size="13" fill="#cbd5e1" >3...Bc5 (Giuoco Piano) or</text>
  <text x="520" y="420" font-size="13" fill="#cbd5e1" >3...Nf6 (Two Knights Defence)</text>

