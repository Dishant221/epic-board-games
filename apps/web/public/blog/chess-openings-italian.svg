  <title id="t">The Italian Game after 3.Bc4</title>
  <desc id="d">A chess board showing the position after 1.e4 e5 2.Nf3 Nc6 3.Bc4. The white bishop on c4 is highlighted with an arrow towards the black pawn on f7. A side panel lists the moves and notes that Black can reply with Bc5 or Nf6.</desc>
